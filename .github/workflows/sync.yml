name: 光遇身高数据自动同步

# 每天 02:00 (北京时间) 自动拉取上游最新数据
# 也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步数据
        env:
          SKY_KAMI: ${{ secrets.SKY_KAMI }}
        run: |
          python3 sync.py

      - name: 检查变更
        id: diff
        run: |
          if git diff --quiet -- data.js data/master.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "本次无数据变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据已更新"
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "sky-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data/master.json
          git commit -m "chore(data): 自动同步 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
